<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credentialing | Lumen Health Network (sample)</title><link rel="stylesheet" href="portal.css">
<style>header{background:#5b3a8c}button{background:#5b3a8c}.hint{font-size:12px;color:#666}iframe{border:1px solid #ccc;width:100%;height:56px}</style></head>
<body>
<div class="sample">Sample portal for the SafeFill demo. Nothing on this page is sent anywhere.</div>
<header><b>Lumen Health Network</b><small>Practitioner credentialing (app-style form, re-renders from its own state)</small></header>
<main>
<form id="form" autocomplete="off">
  <fieldset><legend>About you</legend>
    <div class="row">
      <div class="f"><span class="lbl" id="fn-label">First name</span><input aria-labelledby="fn-label" data-bind="f1" name="f1"></div>
      <div class="f"><label for="f2">Last name</label><input id="f2" data-bind="f2" name="f2"></div>
      <div class="f"><label for="f3">Contact phone or email</label><input id="f3" data-bind="f3" name="contact"><span class="hint">Used for sign-in codes</span></div>
      <div class="f"><span class="lbl">&nbsp;</span><input data-bind="f4" name="f4" placeholder="Email address"></div>
      <div class="f"><label for="f5">License number</label><input id="f5" data-bind="f5" name="f5"></div>
      <div class="f"><label for="f6">NPI</label><input id="f6" data-bind="f6" name="f6"></div>
      <div class="f"><label for="f7">Birth date</label><input id="f7" data-bind="f7" name="f7"></div>
      <div class="f"><label for="pw">Portal password</label><input id="pw" type="password" name="pw"></div>
    </div>
  </fieldset>
  <fieldset><legend>Practice address</legend>
    <address-block></address-block>
  </fieldset>
  <iframe title="Help" srcdoc="<p style='font:13px Arial;margin:8px'>Need help? Call the credentialing desk.</p>"></iframe>
  <p><button type="submit">Submit application</button><span id="submitted"></span></p>
</form>
</main>
<script>
  // A tiny app-style form: inputs are re-rendered from state, like React.
  // A script that sets .value without input events gets wiped on re-render.
  const state = { f6: '1111111111' };
  const bound = () => document.querySelectorAll('[data-bind]');
  function rerender() { for (const el of bound()) el.value = state[el.dataset.bind] || ''; }
  for (const el of bound()) el.addEventListener('input', () => { state[el.dataset.bind] = el.value; });
  document.getElementById('form').addEventListener('change', () => queueMicrotask(rerender));
  window.__rerender = rerender;
  rerender();

  customElements.define('address-block', class extends HTMLElement {
    constructor() {
      super();
      const root = this.attachShadow({ mode: 'open' });
      root.innerHTML = '<style>.row{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}.f{display:flex;flex-direction:column;margin:0 0 10px}label{font:13px Arial;margin:0 0 3px}input{font:15px Arial;padding:6px 8px;border:1px solid #999;border-radius:3px}</style>'
        + '<div class="row">'
        + '<div class="f"><label for="s">Street address</label><input id="s" autocomplete="address-line1"></div>'
        + '<div class="f"><label for="c">City</label><input id="c"></div>'
        + '<div class="f"><label for="st">State</label><input id="st" maxlength="2" pattern="[A-Z]{2}"></div>'
        + '<div class="f"><label for="z">ZIP code</label><input id="z" pattern="\\d{5}"></div>'
        + '</div>';
    }
  });

  window.__submits = 0;
  document.getElementById('form').addEventListener('submit', (e) => { e.preventDefault(); window.__submits++; document.getElementById('submitted').textContent = 'Submitted (sample only)'; });
</script>
</body></html>
