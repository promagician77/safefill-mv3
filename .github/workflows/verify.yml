# Reusable checks, called by pr, staging and release. Never gets a cloud token.
name: verify
on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Build twice in separate folders; every byte must match
        run: |
          node scripts/build.mjs "$RUNNER_TEMP/a"
          node scripts/build.mjs "$RUNNER_TEMP/b"
          cmp "$RUNNER_TEMP/a/release/SHA256SUMS" "$RUNNER_TEMP/b/release/SHA256SUMS"
          for z in "$RUNNER_TEMP"/a/release/*.zip; do cmp "$z" "$RUNNER_TEMP/b/release/$(basename "$z")"; done

      - name: Build
        run: node scripts/build.mjs

      - name: Policy gate (no storage, logging, submission; minimal permissions; network locked)
        run: node scripts/check-policy.mjs dist

      - name: Unit tests, including the signed-tag release gate
        run: npm test

      - name: Install the test-only dependency without running install scripts
        run: npm ci --ignore-scripts

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser tests on the exact build
        run: npx playwright test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hash-list-${{ github.sha }}
          path: release/SHA256SUMS
          if-no-files-found: error
