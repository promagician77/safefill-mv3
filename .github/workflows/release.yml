# Release from a signed tag. Two protected environments:
#   release-gate  restricted to v* tags, no reviewer. Holds ALLOWED_SIGNERS
#                 (one line per signer: "email ssh-ed25519 AAAA...").
#                 Only admins can change it, and the tagged code cannot.
#   release       restricted to v* tags, required reviewer. Holds publishing config.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # brings the annotated, signed tag object
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Release gate (allowed signer, tag = version, every file reproduced)
        env:
          ALLOWED_SIGNERS: ${{ vars.ALLOWED_SIGNERS }}
        run: |
          printf '%s\n' "$ALLOWED_SIGNERS" > "$RUNNER_TEMP/allowed_signers"
          ALLOWED_SIGNERS_FILE="$RUNNER_TEMP/allowed_signers" node scripts/verify-tag.mjs "$GITHUB_REF_NAME"

      - name: Build, policy gate, unit tests
        run: |
          node scripts/build.mjs
          node scripts/check-policy.mjs dist
          npm test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: release/
          if-no-files-found: error

  publish:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.ref_name }}
          path: release

      - name: The zip about to ship matches the signed tag, strictly
        run: |
          git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents:body)' > "$RUNNER_TEMP/signed-sums"
          node scripts/verify-webstore.mjs --zip release/safefill-*.zip --expected "$RUNNER_TEMP/signed-sums" --strict

      - name: Short-lived Google token (GitHub OIDC -> Workload Identity Federation)
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 300s
          create_credentials_file: false

      - name: Upload and submit for review
        env:
          CWS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
        run: |
          node scripts/cws.mjs upload release/safefill-*.zip
          node scripts/cws.mjs publish

      - name: Short-lived AWS credentials for the release archive (optional)
        if: vars.AWS_RELEASE_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 900

      - name: Archive the release in the Object Lock bucket (optional)
        if: vars.AWS_RELEASE_ROLE_ARN != ''
        env:
          BUCKET: ${{ vars.RELEASE_BUCKET }}
        run: |
          cp "$RUNNER_TEMP/signed-sums" release/SIGNED-TAG-SHA256SUMS
          aws s3 cp release/ "s3://$BUCKET/$GITHUB_REF_NAME/" --recursive
